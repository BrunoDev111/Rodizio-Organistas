[build]
  publish = "."

# Funções de push (lembretes com o app fechado). Precisam das variáveis de ambiente
# VAPID_PUBLIC_KEY e VAPID_PRIVATE_KEY configuradas no painel do Netlify.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"